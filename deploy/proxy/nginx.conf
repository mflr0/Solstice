# Example nginx site for Solstice.
# Put this file in /etc/nginx/sites-available/solstice and link it from /etc/nginx/sites-enabled/.
# Replace solstice.example.com and the certificate paths before use.
# Set SOLSTICE_HTTP_TRUSTEDPROXIES=127.0.0.1 on Solstice: this proxy forwards
# X-Forwarded-For (proxy_add_x_forwarded_for), and Solstice believes it from
# the listed addresses only.
# Then run nginx -t and systemctl reload nginx.
server {
    listen 80;
    listen [::]:80;
    server_name solstice.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name solstice.example.com;
    ssl_certificate /etc/letsencrypt/live/solstice.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solstice.example.com/privkey.pem;
    client_max_body_size 100m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Live updates, kept open and unbuffered.
    location /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
