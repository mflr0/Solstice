<svg xmlns="http://www.w3.org/2000/svg" id="draw" viewBox="0 0 180 96" width="180" height="96">
  <!-- A site plan: a plot boundary (dash-dot), two contour lines, a north
       arrow, a detail callout leading to an empty reference bubble. -->
  <style>
    path, circle { fill: none; stroke: #000; stroke-linecap: round; stroke-linejoin: round; }
    .l { stroke-width: 1.3; }
    .t { stroke-width: 0.8; }
    .p { stroke-width: 1.1; stroke-dasharray: 10 3 2 3; }
    .f { fill: #000; stroke: none; }
    :target .l, :target .t { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.2s ease-out forwards; }
    :target .t { animation-duration: 0.8s; animation-delay: 0.6s; }
    :target .p, :target .f { opacity: 0; animation: show 0.6s 1.2s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes show { to { opacity: 1; } }
  </style>
  <path class="p" d="M16 74 42 24 110 14 148 52 104 84Z" />
  <path class="t" pathLength="100" d="M28 64C50 52 74 60 94 48S128 36 138 50M40 42C58 34 72 42 90 32S114 24 122 30" />
  <circle class="l" pathLength="100" cx="160" cy="22" r="9" />
  <path class="f" d="M160 8l4.5 18-4.5-4-4.5 4z" />
  <path class="t" pathLength="100" d="M96 58 120 80H140M140 80a8 8 0 1 0 16 0a8 8 0 1 0 -16 0M140 80H156" />
</svg>
