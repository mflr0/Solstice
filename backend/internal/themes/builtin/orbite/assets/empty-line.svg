    <ellipse cx="100" cy="58" rx="62" ry="17" transform="rotate(-8 100 58)" stroke-opacity=".38" stroke-dasharray="1.5 4.5"/>
  </g>
  <circle cx="100" cy="58" r="18" stroke-width="1.5"/>
  <path clip-path="url(#disc)" d="M80 50.5c12 3.5 28 3 40-1.5M80 60.5c13 3 27 2.5 40-1.5M80 67c12 2 26 1.5 40-1" stroke-opacity=".4"/>
  <circle cx="158.5" cy="55.6" r="2.8" fill="#000" stroke="none"/>
