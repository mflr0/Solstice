    <mask id="behind">
      <rect width="200" height="120" fill="#fff"/>
      <circle cx="100" cy="58" r="23" fill="#000"/>
    </mask>
    <clipPath id="disc">
      <circle cx="100" cy="58" r="17.5"/>
    </clipPath>
  </defs>
  <g mask="url(#behind)">
