<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
  <!-- Orbite, empty state "empty": a ringed planet alone on its orbits. Used as a mask. -->
