version: 2
# Version updates go to the branch the work happens on; security updates
# always target the default branch, that's how GitHub does it.
updates:
  - package-ecosystem: gomod
    directory: /backend
    target-branch: feat/v1.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /frontend
    target-branch: feat/v1.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    target-branch: feat/v1.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /
    target-branch: feat/v1.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    directory: /
    target-branch: feat/v1.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compose-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    directory: /deploy/docker
    target-branch: feat/v1.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compose-deploy-minor-and-patch:
        update-types:
          - minor
          - patch
