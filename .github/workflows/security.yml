# Not run on pull requests on purpose: a new advisory must not fail an
# unrelated PR. It runs daily, on demand and on the long-lived branches.
name: Security

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main, feat/v1.0]

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  pnpm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@12.11.2
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --prod --audit-level high
