name: Docker image

# Pushes ghcr.io/mflr0/solstice: on main as latest and main, on feat/v1.0 as
# feat-v1.0, or by hand with the tags given.
on:
  push:
    branches: [main, feat/v1.0]
  workflow_dispatch:
    inputs:
      tags:
        description: Tags to push, comma-separated (the first one is the version)
        required: true
        default: latest

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ghcr.io/mflr0/solstice
          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - id: tags
        env:
          INPUT_TAGS: ${{ inputs.tags }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -n "$INPUT_TAGS" ]; then
            tags=$(echo "$INPUT_TAGS" | tr ',' '\n' | sed 's/^ *//;s/ *$//;/^$/d;s|^|ghcr.io/mflr0/solstice:|')
            version=$(echo "$INPUT_TAGS" | cut -d, -f1 | tr -d ' ')
          else
            tags=$META_TAGS
            version=$GITHUB_REF_NAME
          fi
          { echo 'list<<EOF'; echo "$tags"; echo EOF; echo "version=$version"; } >> "$GITHUB_OUTPUT"
      - id: go
        run: echo "version=$(sed -n 's/^go //p' backend/go.mod)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            GO_VERSION=${{ steps.go.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
