name: Integration

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check that the seed is synthetic
        run: ../scripts/make-test-seed.sh --check
      - name: Install the MariaDB client
        run: sudo apt-get update && sudo apt-get install --yes mariadb-client
      # Throwaway credentials of a database that lives as long as this job.
      - name: Create the databases
        run: |
          mariadb --protocol=tcp -h 127.0.0.1 -uroot -proot <<'SQL'
          CREATE DATABASE solstice_t CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE DATABASE solstice_t_setup CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER 'solstice'@'%' IDENTIFIED BY 'solstice';
          GRANT ALL ON solstice_t.* TO 'solstice'@'%';
          GRANT ALL ON solstice_t_setup.* TO 'solstice'@'%';
          SQL
      # The directory of tests/ldap_test.go: synthetic people and groups.
      - name: Start the LDAP server
        run: |
          docker run -d --name ldap -p 1389:389 --ulimit nofile=1024:1024 \
            -e LDAP_ORGANISATION=Example -e LDAP_DOMAIN=example.org -e LDAP_ADMIN_PASSWORD=admin -e LDAP_TLS=false \
            -v "$PWD/tests/testdata/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom" \
            osixia/openldap:1.5.0 --copy-service
          for _ in $(seq 60); do
            if docker exec ldap ldapsearch -x -H ldap://localhost -b dc=example,dc=org \
              -D cn=admin,dc=example,dc=org -w admin uid=ldap.ada uid 2>/dev/null | grep -q '^uid: ldap.ada'; then
              exit 0
            fi
            sleep 1
          done
          docker logs ldap
          exit 1
      - name: Load the seed
        run: mariadb --protocol=tcp -h 127.0.0.1 -uroot -proot solstice_t < tests/testdata/seed.sql
      # The seed may be older than the migrations of this branch.
      - name: Migrate
        run: go run ./cmd/solstice migrate
        env:
          SOLSTICE_DB_URL: mysql://solstice:solstice@127.0.0.1:3306/solstice_t
          SOLSTICE_DATA: ${{ runner.temp }}/data
      - name: Test
        run: go test -count=1 ./tests/
        env:
          SOLSTICE_TEST_REQUIRE_DB: "1"
          SOLSTICE_TEST_DB: mysql://solstice:solstice@127.0.0.1:3306/solstice_t
          SOLSTICE_TEST_EMPTY_DB: mysql://solstice:solstice@127.0.0.1:3306/solstice_t_setup
          SOLSTICE_TEST_LDAP: ldap://127.0.0.1:1389
