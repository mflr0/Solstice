# Development databases:
# - mariadb: the Solstice database
# - jira-pg / jira-mysql: synthetic Jira databases (filled by jira-fixture), the sources of the import
# - ldap: synthetic directory of the LDAP sign-in test (SOLSTICE_TEST_LDAP=ldap://127.0.0.1:1389)
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: solstice
      MARIADB_USER: solstice
      MARIADB_PASSWORD: solstice
    ports: ["127.0.0.1:13306:3306"]

  jira-pg:
    image: postgres:16
    environment:
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: jira
      POSTGRES_DB: jira
    ports: ["127.0.0.1:15432:5432"]

  jira-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jira
      MYSQL_USER: jira
      MYSQL_PASSWORD: jira
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    ports: ["127.0.0.1:23306:3306"]

  ldap:
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin
      LDAP_TLS: "false"
    ulimits:
      nofile: 1024
    volumes:
      - ./backend/tests/testdata/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    ports: ["127.0.0.1:1389:389"]
  frontend:
    image: node:latest
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
  backend:
    image: golang:latest
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      SOLSTICE_DB_URL: "solstice:solstice@mariadb:3306/solstice"
    ports:
      - "8080:8080"
    command: go run ./cmd/solstice serve
