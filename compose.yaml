# Bases de développement :
# - mariadb  : la base de Solstice
# - jira-pg / jira-mysql : bases Jira synthétiques (remplies par jira-fixture) servant de source d'import
services:
  mariadb:
    image: mariadb:12.2
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: solstice
      MARIADB_USER: solstice
      MARIADB_PASSWORD: solstice
    ports: ["127.0.0.1:13306:3306"]

  jira-pg:
    image: postgres:16
    environment:
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: jira
      POSTGRES_DB: jira
    ports: ["127.0.0.1:15432:5432"]

  jira-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jira
      MYSQL_USER: jira
      MYSQL_PASSWORD: jira
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    ports: ["127.0.0.1:23306:3306"]
